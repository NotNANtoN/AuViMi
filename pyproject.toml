[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auvimi"
version = "2.0.0"
description = "Audio-Visual Mirror: Real-time CLIP-based neural dreaming"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Anton Wiehe", email = "anton.wiehe@gmail.com" }
]
dependencies = [
    "torch",
    "torchvision",
    "deep-daze>=0.6.0",
    "joblib",
    "opencv-python",
    "Pillow",
    "fastapi",
    "uvicorn",
    "websockets",
    "python-multipart",
    # big-sleep is added as a direct reference below
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy",
    "flake8",
    "pre-commit"
]

[project.urls]
"Homepage" = "https://github.com/NotNANtoN/AuViMi"
"Bug Tracker" = "https://github.com/NotNANtoN/AuViMi/issues"

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.hatch.envs.default]
dependencies = [
    "big-sleep @ git+https://github.com/NotNANtoN/big-sleep@main"
]

[tool.hatch.build.targets.wheel]
packages = ["."]
force-include = { "server.py" = "auvimi/server.py", "client.py" = "auvimi/client.py", "utils.py" = "auvimi/utils.py" }
